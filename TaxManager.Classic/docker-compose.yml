services:
  postgres:
    image: postgres:16-alpine
    container_name: taxmanager-classic-db
    environment:
      POSTGRES_DB: taxmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - taxmanager-classic-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxmanager-classic-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TaxManagerDb: "Host=postgres;Port=5432;Database=taxmanager;Username=postgres;Password=postgres"
    ports:
      - "5080:8080"

volumes:
  taxmanager-classic-data:
